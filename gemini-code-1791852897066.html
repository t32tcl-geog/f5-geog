<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Concept Mind Map</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 12px;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    #info-panel h2 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      color: #38bdf8;
    }
    #info-panel p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #cbd5e1;
    }
    .instructions {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>

  <!-- Import Three.js and Lil-GUI via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="instructions">
    Left Click + Drag: Rotate | Scroll: Zoom | Right Click + Drag: Pan
  </div>

  <div id="info-panel">
    <h2 id="node-title">3D Concept Model</h2>
    <p id="node-desc">Click on any node to view details. Adjust the variables in the control panel on the top right.</p>
  </div>

  <script>
    // --- Data Model Structure ---
    // Customize these topics and descriptions for your target subject
    const mindMapData = {
      title: "Core Concept",
      description: "Central theme connecting all sub-topics.",
      color: 0x38bdf8,
      children: [
        {
          title: "Variable A",
          description: "Represents primary dynamic factors.",
          color: 0xf43f5e,
          children: [
            { title: "Sub-factor A1", description: "First level parameter.", color: 0xfb7185 },
            { title: "Sub-factor A2", description: "Second level parameter.", color: 0xfb7185 }
          ]
        },
        {
          title: "Variable B",
          description: "Represents structural conditions.",
          color: 0x10b981,
          children: [
            { title: "Sub-factor B1", description: "Environmental constraint.", color: 0x34d399 },
            { title: "Sub-factor B2", description: "System input value.", color: 0x34d399 }
          ]
        },
        {
          title: "Variable C",
          description: "Represents system outputs.",
          color: 0xa855f7,
          children: [
            { title: "Sub-factor C1", description: "Direct result observation.", color: 0xc084fc }
          ]
        }
      ]
    };

    // --- Dynamic Parameters for Control GUI ---
    const params = {
      nodeScale: 1.0,
      branchSpread: 3.5,
      nodeDepth: 2.0,
      nodeColor: "#38bdf8",
      wireframe: false,
      resetView: () => controls.reset()
    };

    // --- Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1.2, 100);
    pointLight.position.set(10, 15, 10);
    scene.add(pointLight);

    // --- Mind Map Mesh Collections ---
    const nodeMeshes = [];
    const connectionLines = [];
    const rootGroup = new THREE.Group();
    scene.add(rootGroup);

    const geometry = new THREE.SphereGeometry(0.6, 32, 32);

    // --- Build Visual Mind Map Recursively ---
    function buildMindMap(node, parentMesh = null, depth = 0, angleOffset = 0, angleSpread = Math.PI * 2) {
      const material = new THREE.MeshStandardMaterial({
        color: node.color,
        roughness: 0.3,
        metalness: 0.2,
        wireframe: params.wireframe
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData = { 
        title: node.title, 
        description: node.description,
        depth: depth,
        angleOffset: angleOffset,
        angleSpread: angleSpread,
        parent: parentMesh
      };

      rootGroup.add(mesh);
      nodeMeshes.push(mesh);

      if (parentMesh) {
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.6 });
        const lineGeometry = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(),
          new THREE.Vector3()
        ]);
        const line = new THREE.Line(lineGeometry, lineMaterial);
        line.userData = { startNode: parentMesh, endNode: mesh };
        rootGroup.add(line);
        connectionLines.push(line);
      }

      if (node.children && node.children.length > 0) {
        const count = node.children.length;
        const step = angleSpread / count;
        node.children.forEach((child, index) => {
          const childAngle = angleOffset - angleSpread / 2 + step * index + step / 2;
          buildMindMap(child, mesh, depth + 1, childAngle, step);
        });
      }
    }

    buildMindMap(mindMapData);

    // --- Position Update Logic based on GUI Variables ---
    function updateLayout() {
      nodeMeshes.forEach(mesh => {
        mesh.scale.setScalar(params.nodeScale);

        if (mesh.userData.depth === 0) {
          mesh.position.set(0, 0, 0);
          mesh.material.color.setStyle(params.nodeColor);
        } else {
          const parentPos = mesh.userData.parent.position;
          const dist = params.branchSpread * mesh.userData.depth;
          const angle = mesh.userData.angleOffset;
          const height = (mesh.userData.depth % 2 === 0 ? 1 : -1) * (params.nodeDepth * 0.5);

          mesh.position.set(
            parentPos.x + Math.cos(angle) * dist,
            parentPos.y + height,
            parentPos.z + Math.sin(angle) * dist
          );
        }
      });

      // Update Connection Line Positions
      connectionLines.forEach(line => {
        const start = line.userData.startNode.position;
        const end = line.userData.endNode.position;
        const positions = line.geometry.attributes.position.array;

        positions[0] = start.x;
        positions[1] = start.y;
        positions[2] = start.z;
        positions[3] = end.x;
        positions[4] = end.y;
        positions[5] = end.z;

        line.geometry.attributes.position.needsUpdate = true;
      });
    }

    updateLayout();

    // --- GUI Control Setup ---
    const gui = new lil.GUI({ title: 'Adjust Variables' });
    
    gui.add(params, 'branchSpread', 1.5, 7.0, 0.1).name('Branch Distance').onChange(updateLayout);
    gui.add(params, 'nodeScale', 0.4, 2.5, 0.1).name('Node Size').onChange(updateLayout);
    gui.add(params, 'nodeDepth', 0.0, 5.0, 0.2).name('Vertical Spread').onChange(updateLayout);
    gui.addColor(params, 'nodeColor').name('Root Color').onChange(updateLayout);
    gui.add(params, 'wireframe').name('Wireframe View').onChange(value => {
      nodeMeshes.forEach(m => m.material.wireframe = value);
    });
    gui.add(params, 'resetView').name('Reset Camera');

    // --- Interactivity: Raycasting for Node Click ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeMeshes);

      if (intersects.length > 0) {
        const clickedNode = intersects[0].object;
        document.getElementById('node-title').innerText = clickedNode.userData.title;
        document.getElementById('node-desc').innerText = clickedNode.userData.description;

        // Visual feedback selection pulse
        clickedNode.scale.setScalar(params.nodeScale * 1.4);
        setTimeout(() => clickedNode.scale.setScalar(params.nodeScale), 300);
      }
    });

    // --- Window Resize Handling ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);
      rootGroup.rotation.y += 0.0015; // Slow ambient rotation
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
