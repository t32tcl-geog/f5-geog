<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D River Channel Model</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b132b;
      color: #f8fafc;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 18px 22px;
      border-radius: 12px;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #info-panel h2 {
      margin: 0 0 6px 0;
      font-size: 1.25rem;
      color: #38bdf8;
    }
    #info-panel p {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #cbd5e1;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;
      margin-top: 4px;
    }
    .metric span {
      font-weight: bold;
      color: #38bdf8;
    }
    .instructions {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>

  <!-- Include Three.js, OrbitControls, and lil-gui -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="instructions">
    Left Click + Drag: Rotate | Scroll: Zoom | Right Click + Drag: Pan
  </div>

  <div id="info-panel">
    <h2 id="factor-title">River Channel Dynamics</h2>
    <p id="factor-desc">Adjust
